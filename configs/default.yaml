server:
  # Loopback-only by default: with empty auth (see gateway.auth below) the server
  # refuses to bind a non-loopback interface at startup.
  http_addr: "127.0.0.1:8080"
  ws_addr: "127.0.0.1:8081"
  read_timeout: 10m
  write_timeout: 10m

model:
  provider: "openai"
  model_name: "glm-5.1"
  api_key: "${NEXUS_API_KEY}"
  base_url: "https://open.bigmodel.cn/api/paas/v4/"
  max_tokens: 8192
  temperature: 0.7
  max_concurrency: 1
  min_request_interval_ms: 2500

agent:
  max_iterations: 20
  token_threshold: 100000
  compact_target_ratio: 0.6
  micro_compact_size: 51200
  output_persist_dir: ".outputs"

rag:
  chunk_size: 512
  chunk_overlap: 64
  embedding_dim: 1536
  top_k: 5
  rerank_top_k: 3
  knowledge_dir: ".knowledge"
  # vector_backend: "memory" or "milvus"
  vector_backend: "memory"
  # keyword_backend: "memory" (TF-IDF) or "elasticsearch" (BM25)
  keyword_backend: "memory"
  elasticsearch:
    addresses:
      - "http://localhost:9200"
    index_name: "nexus_chunks"
    # username: ""
    # password: ""
    shards: 1
    replicas: 0
    bm25_k1: 1.2
    bm25_b: 0.75
    auto_create: true
  milvus:
    address: "localhost:19530"
    collection_name: "nexus_vectors"
    metric_type: "COSINE"
    index_type: "IVF_FLAT"
    nlist: 128
    nprobe: 16
    consistency_level: "Session"
    auto_create_collection: true

memory:
  conversation_window: 20
  max_semantic_entries: 500
  semantic_file: ".memory/semantic.yaml"
  compaction_threshold: 80000

planning:
  task_dir: ".tasks"
  max_background_slots: 3
  cron_poll_interval: 60s

team:
  dir: ".team"

run:
  sandbox_dir: ""

gateway:
  lanes:
    main:
      max_concurrency: 1
    cron:
      max_concurrency: 1
    background:
      max_concurrency: 3
  auth:
    api_keys: []
    jwt_secret: ""
  rate_limit:
    enabled: true
    rps: 20
    burst: 40
    # Only trust X-Forwarded-For from these peer addresses. Leave empty to ignore
    # X-Forwarded-For entirely (prevents client-IP spoofing).
    trusted_proxies: []
  # Async job store. Set dir to persist jobs across restarts (empty = in-memory).
  jobs:
    dir: ".jobs"
    max_jobs: 1000
    ttl: 24h

mcp:
  server_enabled: true
  rpc_path: "/mcp/rpc"
  sse_path: "/mcp/sse"
  clients: []

permission:
  mode: "semi_auto"
  workspace_root: "."
  dangerous_patterns:
    - "rm -rf /"
    - "sudo"
    - "chmod 777"
    - "> /dev/sda"
    - "mkfs"

reflection:
  enabled: true
  max_attempts: 3
  threshold: 0.7
  enable_prospect: true
  memory_file: ".memory/reflections.yaml"
  max_mem_entries: 200

# Human-in-the-loop approval center. When enabled, tools that reach the
# permission pipeline's "ask" outcome are recorded as pending approvals
# (reviewable via /api/approvals) instead of failing immediately.
approval:
  enabled: true
  ttl: 10m

observability:
  trace_enabled: true
  metrics_enabled: true
  log_level: "info"
